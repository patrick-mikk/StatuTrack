<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StatuTrack{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="data:,">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen font-sans">
  <header class="border-b border-slate-200 bg-white">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="text-lg font-semibold tracking-tight">StatuTrack</a>
      <nav class="text-sm text-slate-600 space-x-4">
        <a href="/" class="hover:text-slate-900">Browse</a>
        <a href="/healthz" class="hover:text-slate-900">Status</a>
      </nav>
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-6 py-10">
    {% block content %}{% endblock %}
  </main>
  <footer class="border-t border-slate-200 mt-16">
    <div class="max-w-5xl mx-auto px-6 py-6 text-xs text-slate-500">
      Source data from
      <a class="underline" href="https://github.com/justicecanada/laws-lois-xml">justicecanada/laws-lois-xml</a>.
      Not legal advice. Always verify against
      <a class="underline" href="https://laws-lois.justice.gc.ca/">laws-lois.justice.gc.ca</a>.
    </div>
  </footer>
</body>
</html>
